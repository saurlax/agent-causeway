[project]
name = "agent-port-core"
version = "0.0.0"
description = "Reusable communication models for Agent Port"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Saurlax", email = "saurlax@qq.com" }]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.urls]
Homepage = "https://github.com/saurlax/agent-port"
Issues = "https://github.com/saurlax/agent-port/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_port_core"]
