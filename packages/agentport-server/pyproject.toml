[project]
name = "agentport-server"
version = "0.0.0"
description = "AgentPort service and bundled management console"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Saurlax", email = "saurlax@qq.com" }]
requires-python = ">=3.13"
dependencies = [
    "agentport-core",
    "click>=8.2,<9",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/saurlax/agentport"
Issues = "https://github.com/saurlax/agentport/issues"

[project.scripts]
agentport = "agentport_server.cli:main"

[tool.uv.sources]
agentport-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["agentport_server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["agentport_server"]
