[project]
name = "agentcauseway-server"
version = "0.0.0"
description = "AgentCauseway service and bundled management console"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Saurlax", email = "saurlax@qq.com" }]
requires-python = ">=3.13"
dependencies = [
    "agentcauseway-core",
    "aiosqlite>=0.21,<1",
    "click>=8.2,<9",
    "cryptography>=45,<51",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "qrcode>=8,<9",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
]

[project.urls]
Homepage = "https://github.com/saurlax/agent-causeway"
Issues = "https://github.com/saurlax/agent-causeway/issues"

[project.scripts]
agentcauseway = "agentcauseway_server.cli:main"

[tool.uv.sources]
agentcauseway-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["agentcauseway_server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["agentcauseway_server"]
