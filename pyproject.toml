[project]
name = "agentport-workspace"
version = "0.0.0"
description = "Development workspace for AgentPort"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agentport-core = { workspace = true }
agentport-server = { workspace = true }

[dependency-groups]
dev = [
    "agentport-core",
    "agentport-server",
    "httpx2>=2.5,<3",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]

[tool.pyright]
include = [
    "packages/agentport-core/agentport_core",
    "packages/agentport-server/agentport_server",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["packages/agentport-core/tests", "packages/agentport-server/tests"]
